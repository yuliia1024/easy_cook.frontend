name: CI

on:
  push:
    branches: [main]
  pull_request:
  # New advisories come out without a push: the audit runs weekly as well.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Every dependency, dev tools included: a moderate or higher advisory fails the build.
      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Verify package signatures
        run: npm audit signatures

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
